name: Briefing Generation

on:
  workflow_run:
    workflows: ["Signal Ingestion"]
    types: [completed]
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        run: python briefing_job.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive.html docs/firehose.html docs/briefings/
          git diff --cached --quiet || git commit -m "Briefing $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
